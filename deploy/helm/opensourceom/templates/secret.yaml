apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opensourceom.fullname" . }}
  labels:
    {{- include "opensourceom.labels" . | nindent 4 }}
type: Opaque
stringData:
  OM_API_SECRET: {{ required "api.secret is required" .Values.api.secret | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  {{- if .Values.api.google.clientId }}
  OM_GOOGLE_CLIENT_SECRET: {{ required "api.google.clientSecret is required when api.google.clientId is set" .Values.api.google.clientSecret | quote }}
  {{- end }}
  {{- if .Values.api.github.clientId }}
  OM_GITHUB_CLIENT_SECRET: {{ required "api.github.clientSecret is required when api.github.clientId is set" .Values.api.github.clientSecret | quote }}
  {{- end }}
