replicaCount: 1

image:
  repository: ghcr.io/opensourceom/core
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

api:
  env: production
  secret: ""

postgres:
  enabled: true
  host: ""
  image: postgres:16-alpine
  user: opensourceom
  password: ""
  database: opensourceom
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 512Mi
