version: 2

project_name: om

builds:
  - id: om
    main: ./cmd/om
    binary: om
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/OpenSourceOM/core/internal/version.version={{ .Version }}
      - -X github.com/OpenSourceOM/core/internal/version.commit={{ .FullCommit }}
      - -X github.com/OpenSourceOM/core/internal/version.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum

release:
  draft: false
  prerelease: auto
