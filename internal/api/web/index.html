<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSourceOM Console</title>
  <link rel="stylesheet" href="/ui/styles.css" />
  <script src="/ui/vis-network.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>OpenSourceOM</h1>
      <p class="tagline">Graph-native cloud security</p>
    </div>
    <div id="account" class="account hidden">
      <span id="account-label"></span>
      <button id="token-btn" type="button">Create API token</button>
      <button id="security-btn" type="button">Security</button>
      <button id="admins-btn" type="button">Admins</button>
      <button id="logout-btn" type="button">Log out</button>
    </div>
  </header>

  <section id="gate" class="gate">
    <h2 id="gate-title">Sign in</h2>
    <p id="gate-message">Checking session…</p>
    <div id="gate-actions" class="gate-actions"></div>
  </section>

  <section id="token-banner" class="token-banner hidden" role="status">
    <p>This API token is for scripts. Copy it now. It will not be shown again.</p>
    <input id="token-value" readonly aria-label="Secret" />
    <button id="token-dismiss" type="button">Dismiss</button>
  </section>
  <section id="security-panel" class="admins hidden"></section>
  <section id="admins-panel" class="admins hidden"></section>
  <section id="stats" class="stats hidden"></section>

  <main id="console" class="layout hidden">
    <aside>
      <h2>Findings</h2>
      <div id="findings" class="findings"></div>
    </aside>
    <section class="graph-panel">
      <div class="graph-toolbar">
        <h2>Graph Explorer</h2>
        <select id="query-select">
          <option value="">Full graph snapshot</option>
        </select>
        <button id="rules-btn" type="button">Run CSPM rules</button>
        <button id="refresh-btn" type="button">Refresh</button>
      </div>
      <p id="console-error" class="console-error hidden" role="alert"></p>
      <p id="partial-note" class="meta hidden"></p>
      <div id="path-detail" class="detail-panel hidden"></div>
      <div id="blast-radius" class="blast-radius hidden"></div>
      <div id="graph"></div>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
