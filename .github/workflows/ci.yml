name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Check required docs exist
        run: |
          test -f README.md
          test -f docs/ROADMAP.md
          test -f SECURITY.md

      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          echo "ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Render Helm chart
        run: bash deploy/helm/opensourceom/render_test.sh

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opensourceom
          POSTGRES_PASSWORD: opensourceom
          POSTGRES_DB: opensourceom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensourceom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://opensourceom:opensourceom@localhost:5432/opensourceom?sslmode=disable
        run: go test ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.27.1"
          check-latest: false
          go-package: ./...
          cache-dependency-path: go.sum
