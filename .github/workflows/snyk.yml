name: Snyk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache-dependency-path: go.sum

      - name: Skip without SNYK_TOKEN
        if: env.SNYK_TOKEN == ''
        run: echo "Set repo/org secret SNYK_TOKEN and install the Snyk GitHub App on OpenSourceOM to scan this Go module."

      - name: Test go.mod
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/golang@12140f4059e244892ae643824a95459a102120dd
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          GOFLAGS: "-buildvcs=false"
        with:
          args: --file=go.mod --severity-threshold=high --policy-path=.snyk
          command: test

      - name: Monitor go.mod
        if: env.SNYK_TOKEN != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: snyk/actions/golang@12140f4059e244892ae643824a95459a102120dd
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          GOFLAGS: "-buildvcs=false"
        with:
          args: --file=go.mod --policy-path=.snyk
          command: monitor

      # Package-level snyk test (above) can pass while the GitHub-imported
      # project still has Highs. This scan uses go.mod/go.sum only, with no
      # Go toolchain, which matches SCM module-level results. The Snyk API
      # is not used (this org plan has no API entitlement).
      - name: Fail on open Highs in go.mod module graph
        if: env.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: bash scripts/snyk-fail-open-highs.sh
