# Local dev stack: Postgres + API
# Usage: cp .env.example .env && docker compose up -d
# The API image compiles aws-sdk-go-v2/service/ec2. Docker needs at least 6 GiB of RAM.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opensourceom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensourceom}
      POSTGRES_DB: ${POSTGRES_DB:-opensourceom}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opensourceom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${OM_API_PORT:-8080}:8080"
    environment:
      OM_ENV: ${OM_ENV:-development}
      OM_API_PORT: 8080
      OM_PUBLIC_URL: ${OM_PUBLIC_URL:-http://localhost:8080}
      OM_GOOGLE_CLIENT_ID: ${OM_GOOGLE_CLIENT_ID:-}
      OM_GOOGLE_CLIENT_SECRET: ${OM_GOOGLE_CLIENT_SECRET:-}
      OM_GITHUB_CLIENT_ID: ${OM_GITHUB_CLIENT_ID:-}
      OM_GITHUB_CLIENT_SECRET: ${OM_GITHUB_CLIENT_SECRET:-}
      OM_SMTP_HOST: ${OM_SMTP_HOST:-}
      OM_SMTP_PORT: ${OM_SMTP_PORT:-587}
      OM_SMTP_USERNAME: ${OM_SMTP_USERNAME:-}
      OM_SMTP_PASSWORD: ${OM_SMTP_PASSWORD:-}
      OM_SMTP_FROM: ${OM_SMTP_FROM:-}
      POSTGRES_USER: ${POSTGRES_USER:-opensourceom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensourceom}
      POSTGRES_DB: ${POSTGRES_DB:-opensourceom}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
